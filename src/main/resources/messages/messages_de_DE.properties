users.edit.gravatarHelpText=Gravatar wird genutzt, um Profilbilder anzuzeigen. Hierf\u00FCr wird die registrierte E-Mail-Adresse als MD5-Hash an www.gravatar.com geschickt. Wurde die E-Mail-Adresse dort registriert, wird das dort hinterlegte Profilbild in RandIMI angezeigt. Ist die E-Mail-Adresse dort nicht hinterlegt, wird aus dem Hash ein zuf\u00E4lliges Bild berechnet. Wenn Sie nicht wollen, dass Ihre E-Mail-Adresse verschl\u00FCsselt versendet wird, deaktivieren Sie bitte diese Option und ein Standard Icon wird f\u00FCr Ihren Account verwendet.
