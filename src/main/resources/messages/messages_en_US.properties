users.edit.gravatarHelpText=Gravatar is used to display profile pictures. For this purpose, the registered e-mail address is sent as an MD5 hash to www.gravatar.com. If the e-mail address was registered there, the profile picture stored there is displayed in RandIMI. If the e-mail address is not stored there, a random image is calculated from the hash. If you do not want your e-mail address to be sent in encrypted form, please deactivate this option and a standard icon will be used for your account.
