app.version=@project.version@

config.location=/etc/randimi
config.name=db.properties

# Only works if randimi is deployed using Springs embedded tomcat container.
# If you want to deploy to an external tomcat server, change the war name instead.
server.servlet.context-path=/randimi
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-description="Baseline after migration form RandIMI v1 "
spring.flyway.baseline-version=1.1
spring.flyway.locations=classpath:db/migration

spring.jackson.mapper.default-view-inclusion=true

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.show_sql=false

spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

spring.sql.init.mode=always
spring.sql.init.platform=postgres

spring.thymeleaf.prefix=/WEB-INF/views/

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.path=/api
