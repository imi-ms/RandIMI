randimi.selenium.run-randimi-in-docker=false
randimi.selenium.image=randimi

spring.datasource.url=jdbc:postgresql://localhost:5432/randimi_test_db

spring.flyway.clean-disabled=false
spring.flyway.locations=classpath:db/migration,classpath:db/migration-dev,classpath:db/migration-extra
spring.main.allow-bean-definition-overriding=true
